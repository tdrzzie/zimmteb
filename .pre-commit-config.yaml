repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: detect-private-key
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run --frozen ruff format
        language: system
        types: [python]
      - id: artifact-check
        name: Credential and large artifact check
        entry: uv run --frozen python scripts/check_artifacts.py
        language: system
        pass_filenames: false
