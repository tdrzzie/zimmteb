[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "zimmteb"
version = "0.1.0"
description = "Zimbabwe Multilingual Text Embedding Benchmark"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
  "mteb==2.21.0", "sentence-transformers==6.1.0", "datasets>=4,<6",
  "huggingface-hub>=1.3,<2", "torch==2.8.0", "numpy>=1.26,<2.4",
  "scipy==1.16.3", "scikit-learn==1.7.2",
  "pydantic>=2.11,<3", "typer>=0.16,<1", "pyyaml>=6,<7", "psutil>=6,<8",
]

[project.optional-dependencies]
training = ["sentence-transformers[train]==6.1.0"]
reporting = ["pyarrow>=19"]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.12", "mypy>=1.15", "types-PyYAML", "types-psutil", "build>=1.2", "pre-commit>=4"]

[project.scripts]
zimmteb = "zimmteb.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/zimmteb"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel.force-include]
configs = "zimmteb/resources/configs"
datasets = "zimmteb/resources/datasets"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires CUDA", "network: downloads a public model"]
addopts = "-m 'not gpu and not network'"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["pytest-cache-files-*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
files = ["src/zimmteb"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
follow_imports = "silent"
